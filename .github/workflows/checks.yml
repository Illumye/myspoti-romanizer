name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Myspoti's store reads the root manifest: it must be the one the build writes.
      - name: The root manifest is up to date
        run: git diff --exit-code manifest.json
