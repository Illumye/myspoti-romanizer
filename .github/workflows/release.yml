name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The tag is the package's version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      # extension.zip is what Myspoti installs from the repository's address; extension-hook.zip
      # is for a Myspoti with the lyrics-romanize hook, installed from its own address.
      - name: Publish the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/extension.zip dist/extension-hook.zip --title "$GITHUB_REF_NAME" --generate-notes
